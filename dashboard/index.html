<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Offload Remotely | Outreach Dashboard</title>
<style>
  :root { --teal:#148b89; --ink:#183e49; --mute:#637b80; --line:#d9e4e6; --bg:#f6f9f9; --warn:#b3261e; --ok:#1b7f4b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Century Gothic',CenturyGothic,AppleGothic,Arial,sans-serif; font-size:11pt; line-height:1.5; }
  .wrap { max-width:860px; margin:0 auto; padding:18px 14px 70px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  h1 { color:var(--teal); font-size:16pt; margin:4px 0; }
  .small { color:var(--mute); font-size:10pt; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .tab { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:20px; padding:8px 14px; cursor:pointer; font:inherit; }
  .tab.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  .tab b { margin-left:6px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; align-items:center; }
  button.act { background:var(--teal); color:#fff; border:0; border-radius:6px; padding:9px 14px; font:inherit; font-weight:bold; cursor:pointer; }
  button.act.warn { background:var(--warn); }
  button.act.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:normal; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:0 0 12px; }
  .row { display:flex; gap:10px; align-items:flex-start; }
  .row input[type=checkbox] { margin-top:5px; width:18px; height:18px; flex:none; }
  .who { font-weight:bold; }
  .subject { margin:8px 0 4px; font-weight:bold; }
  .body { white-space:pre-wrap; border-left:3px solid var(--teal); padding:2px 0 2px 12px; margin:4px 0 0; }
  .tag { display:inline-block; font-size:9pt; padding:1px 8px; border-radius:10px; background:#e3f3f2; color:var(--teal); margin-left:6px; }
  .tag.bad { background:#fbe9e7; color:var(--warn); }
  .when { color:var(--ok); font-weight:bold; margin-top:6px; }
  .msg { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; }
  .err { color:var(--warn); }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; max-width:90%; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Outreach Dashboard</h1><div class="small">Offload Remotely · private</div></div>
    <div><button class="act ghost" id="refresh">Refresh</button> <button class="act ghost" id="signout">Sign out</button></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="msg">Loading…</div></div>
</div>
<div class="toast" id="toast" style="display:none"></div>
<script>
(function () {
  var SUPABASE_URL = 'https://lovugfxetgdgxmwxmstz.supabase.co';
  var PUBLISHABLE_KEY = 'sb_publishable_47TrmZCifn0SRtWcTMgQig_tQcPS7h9';
  var LS = 'or_dash_key';
  var TABS = [['drafts','Drafts'],['approved','Approved'],['scheduled','Scheduled'],['sent','Sent'],['replies','Replies']];
  var state = { tab: 'drafts', hash: null, data: null, sel: {} };
  var view = document.getElementById('view');
  var tabsEl = document.getElementById('tabs');

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function toast(t) { var x = document.getElementById('toast'); x.textContent = t; x.style.display = 'block'; setTimeout(function () { x.style.display = 'none'; }, 4500); }
  async function sha256Hex(s) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }
  async function rpc(fn, args) {
    var r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': PUBLISHABLE_KEY }, body: JSON.stringify(args) });
    if (!r.ok) throw new Error('Request failed (' + r.status + ')');
    return r.json();
  }
  function fmt(iso, tz) {
    try { return new Intl.DateTimeFormat('en-GB', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)); }
    catch (e) { return iso; }
  }
  function city(tz) { return tz ? tz.split('/').pop().replace('_', ' ') : 'local'; }

  function items(kind) {
    var all = (state.data && state.data.items) || [];
    return all.filter(function (i) {
      if (kind === 'drafts') return i.direction === 'outbound' && ['pending_approval', 'draft', 'changes_requested'].indexOf(i.status) >= 0;
      if (kind === 'approved') return i.direction === 'outbound' && i.status === 'approved' && !i.scheduled_send_at;
      if (kind === 'scheduled') return i.direction === 'outbound' && i.status === 'approved' && !!i.scheduled_send_at;
      if (kind === 'sent') return i.direction === 'outbound' && ['sending', 'sent'].indexOf(i.status) >= 0;
      if (kind === 'replies') return i.direction === 'inbound';
      return false;
    });
  }
  function renderTabs() {
    tabsEl.replaceChildren();
    TABS.forEach(function (t) {
      var n = (state.data && state.data.counts && state.data.counts[t[0]]) || 0;
      var b = el('button', { class: 'tab' + (state.tab === t[0] ? ' on' : ''), type: 'button' }, [document.createTextNode(t[1]), el('b', { text: String(n) })]);
      b.addEventListener('click', function () { state.tab = t[0]; state.sel = {}; render(); });
      tabsEl.appendChild(b);
    });
  }
  function card(it, opts) {
    var head = el('div', {}, [
      el('span', { class: 'who', text: (it.contact || 'Unknown') + ' — ' + (it.company || '') }),
      opts.eligibility ? el('span', { class: 'tag' + (it.eligible ? '' : ' bad'), text: it.eligible ? 'ready to approve' : 'not eligible (email not verified)' }) : null,
      el('div', { class: 'small', text: (it.title || '') + ' · ' + (it.email || '') + (it.location ? ' · ' + it.location : '') })
    ]);
    var inner = el('div', { style: 'flex:1;min-width:0' }, [head, el('div', { class: 'subject', text: 'Subject: ' + (it.subject || '') }), el('div', { class: 'body', text: it.body || '' })]);
    if (it.founder_note) inner.appendChild(el('div', { class: 'small', text: 'Your note: ' + it.founder_note }));
    if (opts.when) inner.appendChild(el('div', { class: 'when', text: opts.when }));
    var row = el('div', { class: 'row' });
    var cb = null;
    if (opts.select) {
      cb = el('input', { type: 'checkbox' });
      cb.disabled = !!opts.disabled;
      cb.checked = !!state.sel[it.message_id];
      cb.addEventListener('change', function () { state.sel[it.message_id] = cb.checked; updateBar(); });
      row.appendChild(cb);
    }
    row.appendChild(inner);
    return el('div', { class: 'card' }, [row]);
  }
  function selected() { return Object.keys(state.sel).filter(function (k) { return state.sel[k]; }); }
  var barBtns = [];
  function updateBar() { var n = selected().length; barBtns.forEach(function (b) { if (b.needsSel) b.node.disabled = n === 0; }); }
  function bar(buttons) {
    barBtns = [];
    var wrap = el('div', { class: 'bar' });
    buttons.forEach(function (d) {
      var b = el('button', { class: 'act' + (d.cls ? ' ' + d.cls : ''), type: 'button', text: d.label });
      b.addEventListener('click', d.fn);
      barBtns.push({ node: b, needsSel: d.needsSel });
      if (d.needsSel) b.disabled = true;
      wrap.appendChild(b);
    });
    return wrap;
  }
  async function decide(action, label, needNote) {
    var ids = selected();
    if (!ids.length) return;
    var note = null;
    if (needNote) { note = window.prompt('What should change?'); if (!note || !note.trim()) return; }
    if (!window.confirm(label + ' ' + ids.length + ' email' + (ids.length === 1 ? '' : 's') + '?')) return;
    try {
      var r = await rpc('dash_decide', { p_key_hash: state.hash, p_action: action, p_message_ids: ids, p_note: note });
      if (!r.ok) { toast('Could not save: ' + (r.error || 'unknown')); return; }
      toast(r.applied + ' of ' + r.requested + ' updated' + (r.applied < r.requested ? ' (the rest were not eligible)' : ''));
      state.sel = {}; await load();
    } catch (e) { toast('Could not save. Please try again.'); }
  }
  async function scheduleAll() {
    if (!window.confirm('Schedule all approved emails for their best send times?')) return;
    try {
      var r = await rpc('dash_schedule', { p_key_hash: state.hash });
      if (!r.ok) { toast('Could not schedule'); return; }
      toast(r.scheduled + ' scheduled' + (r.timezone_unknown ? ', ' + r.timezone_unknown + ' need a time zone' : ''));
      state.tab = 'scheduled'; await load();
    } catch (e) { toast('Could not schedule. Please try again.'); }
  }
  function empty(t) { return el('div', { class: 'msg', text: t }); }

  function render() {
    renderTabs();
    var list = items(state.tab);
    var wrap = el('div');
    if (state.tab === 'drafts') {
      wrap.appendChild(bar([
        { label: 'Select all ready', cls: 'ghost', fn: function () { list.forEach(function (i) { if (i.eligible) state.sel[i.message_id] = true; }); render(); } },
        { label: 'Approve selected', needsSel: true, fn: function () { decide('approve', 'Approve', false); } },
        { label: 'Request changes', cls: 'ghost', needsSel: true, fn: function () { decide('request_changes', 'Request changes on', true); } },
        { label: 'Reject selected', cls: 'warn', needsSel: true, fn: function () { decide('reject', 'Reject', false); } }
      ]));
      if (!list.length) wrap.appendChild(empty('No drafts waiting. Ask Claude to "run today\'s batch".'));
      list.forEach(function (i) { wrap.appendChild(card(i, { select: true, disabled: !i.eligible, eligibility: true })); });
    } else if (state.tab === 'approved') {
      wrap.appendChild(bar([
        { label: 'Schedule all approved', fn: scheduleAll },
        { label: 'Move back to drafts', cls: 'ghost', needsSel: true, fn: function () { decide('unapprove', 'Move back to drafts:', false); } }
      ]));
      if (!list.length) wrap.appendChild(empty('Nothing approved and waiting for a time.'));
      list.forEach(function (i) { wrap.appendChild(card(i, { select: true })); });
    } else if (state.tab === 'scheduled') {
      wrap.appendChild(bar([{ label: 'Move back to drafts', cls: 'ghost', needsSel: true, fn: function () { decide('unapprove', 'Move back to drafts:', false); } }]));
      wrap.appendChild(el('p', { class: 'small', text: 'Planned for 9:30 AM in the recipient\'s time zone, Tuesday to Thursday, 15 minutes apart. Nothing is sent until Claude is told to send.' }));
      if (!list.length) wrap.appendChild(empty('Nothing scheduled.'));
      list.forEach(function (i) {
        var w = 'Planned: ' + fmt(i.scheduled_send_at, i.tz || 'UTC') + ' ' + city(i.tz) + ' time · ' + fmt(i.scheduled_send_at, 'Asia/Karachi') + ' your time (Karachi)';
        wrap.appendChild(card(i, { select: true, when: w }));
      });
    } else if (state.tab === 'sent') {
      if (!list.length) wrap.appendChild(empty('Nothing sent yet.'));
      list.slice().reverse().forEach(function (i) {
        wrap.appendChild(card(i, { when: i.sent_at ? 'Sent: ' + fmt(i.sent_at, 'Asia/Karachi') + ' (Karachi)' : 'Sending…' }));
      });
    } else {
      if (!list.length) wrap.appendChild(empty('No replies yet. Tell Claude "check replies" and they will appear here.'));
      list.slice().reverse().forEach(function (i) {
        wrap.appendChild(card(i, { when: (i.reply_class ? i.reply_class + ' · ' : '') + (i.received_at ? 'Received: ' + fmt(i.received_at, 'Asia/Karachi') + ' (Karachi)' : '') }));
      });
    }
    view.replaceChildren(wrap);
    updateBar();
  }
  async function load() {
    try {
      var r = await rpc('dash_overview', { p_key_hash: state.hash });
      if (!r.ok) { localStorage.removeItem(LS); view.replaceChildren(el('div', { class: 'msg err', text: 'This dashboard link is not valid. Please use your private dashboard link.' })); tabsEl.replaceChildren(); return; }
      state.data = r; render();
    } catch (e) { view.replaceChildren(el('div', { class: 'msg err', text: 'Could not reach the service. Please refresh.' })); }
  }
  async function init() {
    var m = /^#k=([a-f0-9]{64})$/.exec(location.hash || '');
    if (m) { try { localStorage.setItem(LS, m[1]); } catch (e) {} history.replaceState(null, '', location.pathname); }
    var key = null; try { key = localStorage.getItem(LS); } catch (e) {}
    if (!key) { view.replaceChildren(el('div', { class: 'msg err', text: 'Open your private dashboard link once on this device to sign in.' })); return; }
    state.hash = await sha256Hex(key);
    load();
  }
  document.getElementById('refresh').addEventListener('click', function () { if (state.hash) load(); });
  document.getElementById('signout').addEventListener('click', function () { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); });
  init();
})();
</script>
</body>
</html>
